# Render Blueprint — single free web service running both Next.js and the BullMQ worker.
# Secrets are marked `sync: false`: Render prompts for them on first deploy and
# stores them in the dashboard, so nothing sensitive lives in the repo.
services:
  - type: web
    name: kavach
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Queue namespace. Must be unique per environment so a local worker and
      # the deployed one never consume each other's jobs.
      - key: QUEUE_PREFIX
        value: kavach-render
      - key: DATABASE_URL
        sync: false
      - key: QUEUE_URL
        sync: false
      - key: TWELVE_LABS_API_KEY
        sync: false
      - key: TWELVE_LABS_INDEX_ID
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
